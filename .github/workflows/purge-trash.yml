name: Purge Trash (>30 giorni)

on:
  schedule:
    - cron: '0 2 * * *'  # Ogni notte alle 02:00 UTC (04:00 ora italiana)
  workflow_dispatch:      # Esecuzione manuale dalla tab Actions

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama endpoint purge
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/purge-trash" \
            -H "x-purge-secret: ${{ secrets.PURGE_SECRET }}")
          echo "HTTP status: $RESPONSE"
          cat /tmp/response.json
          if [ "$RESPONSE" != "200" ]; then
            echo "Purge fallito con status $RESPONSE"
            exit 1
          fi
